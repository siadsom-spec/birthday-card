<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Gift Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #8b0000;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CONTROLLING PAGES */
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
    }

    .page.active {
      display: flex;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ================= PAGE 1: ENVELOPE CARD ================= */
    #page-1 {
      background-image: radial-gradient(circle, #a80000 0%, #600000 100%);
      padding: 20px;
    }

    .envelope-card {
      background-color: #fdfbf7;
      width: 100%;
      max-width: 350px;
      border-radius: 16px;
      padding: 40px 20px 30px 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .greeting-title {
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
      color: #9e1b1b;
      margin-bottom: 25px;
    }

    .envelope-box {
      width: 100%;
      max-width: 250px;
      height: 180px;
      background: #ffffff;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      border: 1px solid #f0f0f0;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }

    .red-envelope {
      width: 85%;
      height: 110px;
      background-color: #9e1b1b;
      border-radius: 6px;
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .red-envelope:hover {
      transform: scale(1.04);
    }

    .red-envelope::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-top: 55px solid #7a1212;
    }

    .ribbon-seal {
      width: 36px;
      height: 28px;
      position: relative;
      z-index: 2;
    }

    .ribbon-seal::before,
    .ribbon-seal::after {
      content: '';
      position: absolute;
      width: 15px;
      height: 18px;
      background: #ffffff;
      border-radius: 50% 50% 0 50%;
      top: 4px;
    }

    .ribbon-seal::before {
      left: 1px;
      transform: rotate(-25deg);
    }

    .ribbon-seal::after {
      right: 1px;
      transform: rotate(25deg) scaleX(-1);
    }

    .instruction-text {
      font-size: 11px;
      color: #777777;
    }

    /* ================= PAGE 2: FULL IMAGE & CONFETTI ================= */
    #page-2 {
      background-image: url('https://i.postimg.cc/jqkNPbJ1/da1478c736e944eb8f1ec711d8c60617.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: fixed;
    }

    #confettiCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .card-box {
      position: relative;
      z-index: 2;
      width: 85%;
      max-width: 320px;
      background: linear-gradient(135deg, #801212, #4a0808);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .card-title {
      font-family: 'Great Vibes', cursive;
      font-size: 38px;
      color: #ffffff;
    }

    .btn-back {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div id="page-1" class="page active">
    <div class="envelope-card">
      <h1 class="greeting-title">Happy Birthday!</h1>
      
      <div class="envelope-box">
        <div class="red-envelope" onclick="openPage2()">
          <div class="ribbon-seal"></div>
        </div>
      </div>

      <p class="instruction-text">Click the seal to open</p>
    </div>
  </div>

  <div id="page-2" class="page">
    <button class="btn-back" onclick="openPage1()">&larr; Back</button>
    <canvas id="confettiCanvas"></canvas>

    <div class="card-box">
      <h1 class="card-title">Happy Birthday!</h1>
      <div style="font-size: 26px;">🎉</div>
      <p style="font-size: 11px; opacity: 0.9;">I hope this little gift will make you happy ❤️</p>
      <button style="background: #fff; color: #000; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 11px; cursor: pointer;">Click here ✨</button>
    </div>
  </div>

  <script>
    // PAGE SWITCHING
    function openPage2() {
      document.getElementById('page-1').classList.remove('active');
      document.getElementById('page-2').classList.add('active');
      startConfetti();
    }

    function openPage1() {
      document.getElementById('page-2').classList.remove('active');
      document.getElementById('page-1').classList.add('active');
    }

    // CONFETTI ANIMATION
    function startConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#f44336', '#e91e63', '#9c27b0', '#2196f3', '#ffeb3b', '#4caf50'];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 3 + 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: Math.random() * 2 - 1,
          vy: Math.random() * 1.5 + 0.5
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();

          p.x += p.vx;
          p.y += p.vy;

          if (p.y > canvas.height) p.y = 0;
        });
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>

</body>
</html>
