<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Gift Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #8b0000;
      background-image: radial-gradient(circle, #a80000 0%, #600000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-viewport {
      width: 100%;
      max-width: 380px;
      position: relative;
    }

    /* CONTROL PAGE SWITCHING */
    .page {
      display: none;
      width: 100%;
    }

    .page.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ================= BOGGA 1: RED HAPPY BIRTHDAY CARD ================= */
    .card-container {
      background-color: #fdfbf7;
      width: 100%;
      border-radius: 16px;
      padding: 35px 20px 25px 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .greeting-title {
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
      color: #9e1b1b;
      margin-bottom: 20px;
    }

    .envelope-box {
      width: 100%;
      height: 200px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid #f0f0f0;
    }

    .red-envelope {
      width: 80%;
      height: 110px;
      background-color: #9e1b1b;
      border-radius: 6px;
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .red-envelope:hover {
      transform: scale(1.04);
    }

    .red-envelope::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-top: 55px solid #7a1212;
    }

    .ribbon-seal {
      width: 40px;
      height: 30px;
      position: relative;
      z-index: 2;
    }

    .ribbon-seal::before,
    .ribbon-seal::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 20px;
      background: #ffffff;
      border-radius: 50% 50% 0 50%;
      top: 4px;
    }

    .ribbon-seal::before {
      left: 2px;
      transform: rotate(-25deg);
    }

    .ribbon-seal::after {
      right: 2px;
      transform: rotate(25deg) scaleX(-1);
    }

    .instruction-text {
      font-size: 11px;
      color: #777777;
    }

    /* ================= BOGGA 2: STUDIO / GIFT DISPLAY ================= */
    .studio-card {
      width: 100%;
      background-image: url('https://i.postimg.cc/jqkNPbJ1/da1478c736e944eb8f1ec711d8c60617.webp');
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    /* OVERLAY FOR BETTER READABILITY */
    .studio-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(2px);
      z-index: 1;
    }

    .studio-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* BACK BUTTON */
    .btn-back-nav {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      width: max-content;
    }

    /* NAMES HEADER */
    .names-header {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* LOCK PIN BOX */
    .lock-box {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }

    .pin-code {
      background: #ffffff;
      color: #000;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    /* 4 SQUARE ICONS GRID */
    .grid-4-icons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .icon-square {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
    }

    .icon-square span.emoji {
      font-size: 18px;
    }

    /* PAPER MESSAGE BOX */
    .paper-wrapper {
      position: relative;
      width: 100%;
      height: 160px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .paper-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .paper-text {
      position: relative;
      z-index: 2;
      width: 80%;
      color: #2b1e10;
      font-family: 'Caveat', cursive;
      font-size: 16px;
      line-height: 1.3;
      text-align: center;
    }
  </style>
</head>
<body>

    <div id="page-1" class="page active">
      <div class="card-container">
        <h1 class="greeting-title">Happy Birthday!</h1>

          <div class="red-envelope" onclick="openStudioPage()">

              <span class="emoji">🎵</span>

            </div>
            <div class="icon-square">
              <span class="emoji">🎙️</span>
              <span>Voice</span>
            </div>
          </div>
