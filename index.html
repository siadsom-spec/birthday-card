<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise Birthday Experience</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0c0a09;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      color: #fff;
    }

    .page {
      display: none;
      width: 100vw;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .page.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
    }

    /* ------------------------------------
       PAGE 1: POS / PASSWORD LOCK SCREEN
    ------------------------------------ */
    #page-pos {
      background: linear-gradient(135deg, #ffeef2 0%, #e8d5ff 100%);
      color: #333;
      padding: 20px;
    }

    .pos-container {
      background: #fbcfe8;
      border: 4px solid #fff;
      border-radius: 24px;
      padding: 25px 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(219, 39, 119, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .pos-screen {
      background: #ffffff;
      width: 100%;
      height: 70px;
      border-radius: 14px;
      border: 2px dashed #f472b6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
    }

    .pos-pin-display {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #db2777;
      min-height: 32px;
    }

    .pos-hint {
      font-size: 12px;
      color: #9d174d;
      margin-top: 2px;
    }

    .pos-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .pos-btn {
      background: #ffffff;
      border: none;
      border-radius: 12px;
      height: 50px;
      font-size: 20px;
      font-weight: 600;
      color: #831843;
      box-shadow: 0 4px 0 #f472b6;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pos-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #f472b6;
    }

    .pos-btn.enter {
      background: #4ade80;
      color: #064e3b;
      box-shadow: 0 4px 0 #22c55e;
    }

    .pos-btn.clear {
      background: #fca5a5;
      color: #7f1d1d;
      box-shadow: 0 4px 0 #f87171;
    }

    /* ------------------------------------
       PAGE 2: BALLOON GAME
    ------------------------------------ */
    #page-balloon {
      background-color: #f7f3f0;
      color: #333;
      padding: 60px 20px;
      text-align: center;
      justify-content: space-between;
    }

    .balloon-wrapper {
      cursor: pointer;
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s;
    }

    .balloon-body {
      width: 140px;
      height: 175px;
      background: radial-gradient(circle at 35% 35%, #76ec2a, #43b005);
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset -10px -10px 20px rgba(0,0,0,0.15);
    }

    .balloon-number {
      color: white;
      font-size: 48px;
      font-weight: 700;
    }

    .balloon-knot {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 12px solid #3d9e04;
    }

    .balloon-string {
      width: 2px;
      height: 100px;
      background-color: #ccc;
    }

    /* ------------------------------------
       PAGE 3: MAIN MENU
    ------------------------------------ */
    #page3 {
      background-color: #800020;
      padding: 30px 20px;
    }

    .menu-title {
      font-family: 'Great Vibes', cursive;
      font-size: 50px;
      color: #fff;
      margin-bottom: 40px;
    }

    .menu-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: flex-end;
      width: 100%;
      max-width: 500px;
    }

    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease;
    }

    .menu-card:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.2);
    }

    .menu-card img {
      width: 100%;
      max-width: 90px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .menu-card p {
      font-family: 'Great Vibes', cursive;
      font-size: 26px;
    }

    /* ------------------------------------
       PAGE 4: MESSAGE & SCRAPBOOK PAGE
    ------------------------------------ */
    #page-message {
      background: #700913; /* Redish dark theme like in screenshot */
      background-image: radial-gradient(rgba(0,0,0,0.3) 15%, transparent 16%);
      background-size: 16px 16px;
      padding: 30px 15px 60px 15px;
      min-height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .msg-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
    }

    .header-sticker {
      background: #ffffff;
      color: #a8131d;
      font-family: 'Caveat', cursive;
      font-size: 32px;
      padding: 6px 25px;
      border-radius: 8px;
      transform: rotate(-2deg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-weight: bold;
    }

    /* ALPHABET CARDS (A, B, C, D, E) */
    .cards-wrapper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .card-item {
      background: #fffefb;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 110px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      position: relative;
      border: 1px solid #e2d8c9;
      transition: transform 0.2s;
    }

    .card-item:hover {
      transform: scale(1.05) rotate(1deg);
    }

    .card-letter {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 700;
      color: #1b4332;
    }

    .card-img-preview {
      width: 100%;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      display: none;
      margin-bottom: 5px;
    }

    .upload-btn-mini {
      font-size: 10px;
      background: #e2e8f0;
      color: #334155;
      padding: 4px 6px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }

    /* LONG PAPER NOTE AT BOTTOM */
    .long-note-card {
      background: #1c1917;
      border: 1px solid #44403c;
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      color: #f5f5f4;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
    }

    .note-tag {
      font-size: 12px;
      color: #a8a29e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .note-textarea {
      width: 100%;
      min-height: 140px;
      max-height: 300px;
      background: transparent;
      border: none;
      color: #fef08a;
      font-family: 'Caveat', cursive;
      font-size: 22px;
      line-height: 1.4;
      resize: vertical;
      outline: none;
    }

    .note-textarea::placeholder {
      color: #78716c;
    }

    .back-btn {
      background: #ffffff;
      color: #800020;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* MODAL FOR IMAGE DISPLAY */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      max-width: 350px;
      width: 100%;
      text-align: center;
      color: #333;
    }

    .modal-box img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    /* HIDDEN FILE INPUTS */
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <section id="page-pos" class="page active">
    <div class="pos-container">
      <div class="pos-screen">
        <div id="pin-display" class="pos-pin-display"></div>
        <div class="pos-hint">Enter PIN (Default: 912)</div>
      </div>

      <div class="pos-keypad">
        <button class="pos-btn" onclick="pressKey('1')">1</button>
        <button class="pos-btn" onclick="pressKey('2')">2</button>
        <button class="pos-btn" onclick="pressKey('3')">3</button>
        <button class="pos-btn" onclick="pressKey('4')">4</button>
        <button class="pos-btn" onclick="pressKey('5')">5</button>
        <button class="pos-btn" onclick="pressKey('6')">6</button>
        <button class="pos-btn" onclick="pressKey('7')">7</button>
        <button class="pos-btn" onclick="pressKey('8')">8</button>
        <button class="pos-btn" onclick="pressKey('9')">9</button>
        <button class="pos-btn clear" onclick="clearKey()">C</button>
        <button class="pos-btn" onclick="pressKey('0')">0</button>
        <button class="pos-btn enter" onclick="submitKey()">✓</button>
      </div>
    </div>
  </section>

  <section id="page-balloon" class="page">
    <h2>Sadiqq sent you balloons 🎈</h2>
    <div class="balloon-wrapper" onclick="popBalloon()">
      <div class="balloon-body">
        <span id="balloon-count" class="balloon-number">1</span>
      </div>
      <div class="balloon-knot"></div>
      <div class="balloon-string"></div>
    </div>
    <p style="color: #666; font-size: 14px;">Press to pop ✨</p>
  </section>

  <section id="page3" class="page">
    <h1 class="menu-title">These are for you</h1>
    <div class="menu-grid">
      <div class="menu-card" onclick="showPage('page-message')">
        <img src="https://i.postimg.cc/P5mQW5Zq/fd28b166029642a7a92f965be93dc657.webp" alt="Message">
        <p>Message</p>
      </div>
      <div class="menu-card" onclick="alert('Flower section ✨')">
        <img src="https://i.postimg.cc/xdVbnwsh/221693915545497b49634065bc732e4d.jpg" alt="Flower">
        <p>Flower</p>
      </div>
      <div class="menu-card" onclick="alert('Cake section 🎂')">
        <img src="https://cdn-icons-png.flaticon.com/512/2682/2682411.png" alt="Cake">
        <p>Cake</p>
      </div>
    </div>
  </section>

  <section id="page-message" class="page">
    <div class="msg-container">
      
      <div class="header-sticker">person ⤵️</div>

      <div class="cards-wrapper">
        <div class="card-item" onclick="handleCardClick('A')">
          <img id="img-preview-A" class="card-img-preview" alt="Preview A">
          <span id="letter-A" class="card-letter">A</span>
          <button class="upload-btn-mini" onclick="triggerUpload(event, 'A')">📷 Upload Image</button>
          <input type="file" id="file-A" accept="image/*" onchange="previewImage(event, 'A')">
        </div>

        <div class="card-item" onclick="handleCardClick('B')">
          <img id="img-preview-B" class="card-img-preview" alt="Preview B">
          <span id="letter-B" class="card-letter">B</span>
          <button class="upload-btn-mini" onclick="triggerUpload(event, 'B')">📷 Upload Image</button>
          <input type="file" id="file-B" accept="image/*" onchange="previewImage(event, 'B')">
        </div>

        <div class="card-item" onclick="handleCardClick('C')">
          <img id="img-preview-C" class="card-img-preview" alt="Preview C">
          <span id="letter-C" class="card-letter">C</span>
          <button class="upload-btn-mini" onclick="triggerUpload(event, 'C')">📷 Upload Image</button>
          <input type="file" id="file-C" accept="image/*" onchange="previewImage(event, 'C')">
        </div>

        <div class="card-item" onclick="handleCardClick('D')">
          <img id="img-preview-D" class="card-img-preview" alt="Preview D">
          <span id="letter-D" class="card-letter">D</span>
          <button class="upload-btn-mini" onclick="triggerUpload(event, 'D')">📷 Upload Image</button>
          <input type="file" id="file-D" accept="image/*" onchange="previewImage(event, 'D')">
        </div>

        <div class="card-item" onclick="handleCardClick('E')">
          <img id="img-preview-E" class="card-img-preview" alt="Preview E">
          <span id="letter-E" class="card-letter">E</span>
          <button class="upload-btn-mini" onclick="triggerUpload(event, 'E')">📷 Upload Image</button>
          <input type="file" id="file-E" accept="image/*" onchange="previewImage(event, 'E')">
        </div>
      </div>

      <div class="long-note-card">
        <div class="note-tag">From: Someone / For: You</div>
        <textarea class="note-textarea" placeholder="Dhallo farxad leh gofkayga aan ugu jeclahay adduunka. Waxaad tahay gofka ngu wanaagsan ee aan waligay jeclaan karo... (U qor farintaada dheer halkan)"></textarea>
      </div>

      <button class="back-btn" onclick="showPage('page3')">Back to Menu</button>
    </div>
  </section>

  <div id="imageModal" class="modal-overlay">
    <div class="modal-box">
      <img id="modalImg" src="" alt="View">
      <button class="back-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    let enteredPin = "";
    const correctPin = "912"; // Passcode-ka aad isticmaali kartid

    function pressKey(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        document.getElementById('pin-display').innerText = "*".repeat(enteredPin.length);
      }
    }

    function clearKey() {
      enteredPin = "";
      document.getElementById('pin-display').innerText = "";
    }

    function submitKey() {
      if (enteredPin === correctPin || enteredPin.length > 0) {
        showPage('page-balloon');
      } else {
        alert('Password-ka waa ku maamul!');
        clearKey();
      }
    }

    /* BALLOON LOGIC */
    let balloonCount = 1;
    function popBalloon() {
      balloonCount++;
      if (balloonCount <= 5) {
        document.getElementById('balloon-count').innerText = balloonCount;
      } else {
        showPage('page3');
      }
    }

    /* PAGE SWITCHER WITH ANIMATION */
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => {
        p.classList.remove('active');
      });
      const target = document.getElementById(pageId);
      if (target) {
        target.classList.add('active');
      }
    }

    /* IMAGE UPLOAD & PREVIEW LOGIC */
    const imageStore = {};

    function triggerUpload(event, letter) {
      event.stopPropagation(); // Prevents card click
      document.getElementById('file-' + letter).click();
    }

    function previewImage(event, letter) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imageStore[letter] = e.target.result;
          
          const imgEl = document.getElementById('img-preview-' + letter);
          const letterEl = document.getElementById('letter-' + letter);
          
          imgEl.src = e.target.result;
          imgEl.style.display = 'block';
          letterEl.style.fontSize = '20px';
        };
        reader.readAsDataURL(file);
      }
    }

    function handleCardClick(letter) {
      if (imageStore[letter]) {
        document.getElementById('modalImg').src = imageStore[letter];
        document.getElementById('imageModal').classList.add('active');
      } else {
        alert('Fadlan marka hore taabo badhanka "Upload Image" si aad sawir ugu soo xulato kaardkan ' + letter);
      }
    }

    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }
  </script>
</body>
</html>
