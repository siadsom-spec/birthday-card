<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0d2818;
      background-image: radial-gradient(circle at 50% 0%, #1a4228 0%, #0d2818 70%);
      color: #e2ebe4;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px 12px;
    }

    .app-viewport {
      width: 100%;
      max-width: 430px;
    }

    /* BOGGA CONTROL-KA (PAGE SWITCHING) */
    .page {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .page.active {
      display: flex;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
    }

    .tabs-header {
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 30px;
      display: flex;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #a3c2ac;
      padding: 10px 14px;
      border-radius: 25px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #0d2818;
    }

    .badge {
      background: rgba(0, 0, 0, 0.15);
      padding: 2px 7px;
      border-radius: 50%;
      font-size: 10px;
    }

    /* BATOONKA NEW GIFT EE BOGGA 1-AAD */
    .new-gift-hero-btn {
      background-color: #2e7d32;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 16px 24px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      transition: background 0.2s;
    }

    .new-gift-hero-btn:hover {
      background-color: #388e3c;
    }

    /* CARDS */
    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 20px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 400;
      text-align: center;
      color: #f3f7f4;
      margin-bottom: 10px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      width: max-content;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #b3c9b8;
    }

    .custom-input {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="app-viewport">

    <div id="page-home" class="page active">
      
      <div class="tabs-header">
        <button class="tab-btn">💐 BOUQUETS <span class="badge">9</span></button>
        <button class="tab-btn active">🎁 GIFTS <span class="badge">0</span></button>
      </div>

      <button class="new-gift-hero-btn" onclick="goToStudio()">
        🎁 NEW GIFT &rarr;
      </button>

      <div class="glass-card" style="text-align: center; padding: 30px 20px;">
        <h3 style="font-size: 16px; margin-bottom: 8px;">No gift states yet</h3>
        <p style="font-size: 12px; color: #a2baa7;">Taabo batoonka "NEW GIFT" ee ka sarreeya si aad fariin iyo xdiyad cusub u samayso.</p>
      </div>

    </div>

    <div id="page-studio" class="page">
      
      <button class="back-btn" onclick="goHome()">&larr; BACK HOME</button>

      <h1 class="hero-title">The Link lasts forever</h1>

      <div class="glass-card grid-2">
        <div class="form-group">
          <label>FROM</label>
          <input type="text" class="custom-input" placeholder="Sadiqq">
        </div>
        <div class="form-group">
          <label>FOR (TO)</label>
          <input type="text" class="custom-input" placeholder="Salmoo">
        </div>
      </div>

    </div>

  </div>

  <script>
    function goToStudio() {
      document.getElementById('page-home').classList.remove('active');
      document.getElementById('page-studio').classList.add('active');
      window.scrollTo(0, 0);
    }

    function goHome() {
      document.getElementById('page-studio').classList.remove('active');
      document.getElementById('page-home').classList.add('active');
      window.scrollTo(0, 0);
    }
  </script>

</body>
</html>
