<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Party & Gifts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Top Tabs Header -->
    <div class="tabs-header">
      <button class="tab-btn">💐 BOUQUETS <span class="badge">9</span></button>
      <button class="tab-btn active">🎁 GIFTS <span class="badge">0</span></button>
    </div>

    <!-- Top Action Button -->
    <div class="action-top">
      <button class="primary-btn">NEW GIFT &rarr;</button>
    </div>

    <!-- Main Card Box -->
    <div class="card-box">
      <h2>No gift states yet.</h2>
      <p>Create a gift state from the studio. Sent gifts and saved drafts will show here like the Garden tab.</p>
      
      <button class="primary-btn">NEW GIFT &rarr;</button>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-card">
      <span class="step-label">— ONE —</span>
      <h3>Pick your container</h3>
    </div>

  </div>

</body>
</html>
