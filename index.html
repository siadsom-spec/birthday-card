<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise Birthday Experience</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0c0a09;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      color: #fff;
    }

    .page {
      display: none;
      width: 100vw;
      min-height: 100vh;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .page.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
    }

    /* ------------------------------------
       PAGE 1: POS / PASSWORD LOCK SCREEN
    ------------------------------------ */
    #page-pos {
      background: linear-gradient(135deg, #ffeef2 0%, #e8d5ff 100%);
      color: #333;
      padding: 20px;
    }

    .pos-container {
      background: #fbcfe8;
      border: 4px solid #fff;
      border-radius: 24px;
      padding: 25px 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(219, 39, 119, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .pos-screen {
      background: #ffffff;
      width: 100%;
      height: 70px;
      border-radius: 14px;
      border: 2px dashed #f472b6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
    }

    .pos-pin-display {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #db2777;
      min-height: 32px;
    }

    .pos-hint {
      font-size: 12px;
      color: #9d174d;
      margin-top: 2px;
    }

    .pos-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .pos-btn {
      background: #ffffff;
      border: none;
      border-radius: 12px;
      height: 50px;
      font-size: 20px;
      font-weight: 600;
      color: #831843;
      box-shadow: 0 4px 0 #f472b6;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pos-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #f472b6;
    }

    .pos-btn.enter {
      background: #4ade80;
      color: #064e3b;
      box-shadow: 0 4px 0 #22c55e;
    }

    .pos-btn.clear {
      background: #fca5a5;
      color: #7f1d1d;
      box-shadow: 0 4px 0 #f87171;
    }

    /* ------------------------------------
       PAGE 2: BALLOON GAME
    ------------------------------------ */
    #page-balloon {
      background-color: #f7f3f0;
      color: #333;
      padding: 60px 20px;
      text-align: center;
      justify-content: space-between;
    }

    .balloon-wrapper {
      cursor: pointer;
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s;
    }

    .balloon-body {
      width: 140px;
      height: 175px;
      background: radial-gradient(circle at 35% 35%, #76ec2a, #43b005);
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset -10px -10px 20px rgba(0,0,0,0.15);
    }

    .balloon-number {
      color: white;
      font-size: 48px;
      font-weight: 700;
    }

    .balloon-knot {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 12px solid #3d9e04;
    }

    .balloon-string {
      width: 2px;
      height: 100px;
      background-color: #ccc;
    }

    /* ------------------------------------
       PAGE 3: MAIN MENU
    ------------------------------------ */
    #page3 {
      background-color: #800020;
      padding: 30px 20px;
    }

    .menu-title {
      font-family: 'Great Vibes', cursive;
      font-size: 50px;
      color: #fff;
      margin-bottom: 40px;
    }

    .menu-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: flex-end;
      width: 100%;
      max-width: 500px;
    }

    .menu-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease;
    }

    .menu-card:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.2);
    }

    .menu-card img {
      width: 100%;
      max-width: 90px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .menu-card p {
      font-family: 'Great Vibes', cursive;
      font-size: 26px;
    }

    /* ------------------------------------
       PAGE 4: MESSAGE & SCRAPBOOK PAGE
    ------------------------------------ */
    #page-message {
      background: #700913;
      background-image: radial-gradient(rgba(0,0,0,0.3) 15%, transparent 16%);
      background-size: 16px 16px;
      padding: 30px 15px 60px 15px;
      min-height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .msg-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;
    }

    /* TOP ROW WITH STICKER NOTE */
    .top-layout-row {
      display: flex;
      width: 100%;
      gap: 15px;
      align-items: flex-start;
      justify-content: space-between;
    }

    .person-sticker {
      background: #ffffff;
      color: #800020;
      font-family: 'Caveat', cursive;
      font-size: 26px;
      padding: 6px 18px;
      border-radius: 8px;
      transform: rotate(-3deg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-weight: bold;
    }

    /* GEESKA WARADDA (POST-IT NOTE) */
    .corner-note {
      background: #fef08a;
      color: #1c1917;
      padding: 14px;
      border-radius: 10px;
      width: 180px;
      box-shadow: 4px 6px 15px rgba(0,0,0,0.3);
      transform: rotate(2deg);
      position: relative;
      border: 1px solid #fde047;
    }

    .corner-note-text {
      font-family: 'Caveat', cursive;
      font-size: 18px;
      line-height: 1.2;
      height: 55px;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .note-actions {
      display: flex;
      gap: 5px;
    }

    .btn-note {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-view {
      background: #a8131d;
      color: white;
    }

    .btn-edit {
      background: #e2e8f0;
      color: #334155;
    }

    /* ALPHABET CARDS (A, B, C, D, E) */
    .cards-wrapper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .card-item {
      background: #fffefb;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 110px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      position: relative;
      border: 1px solid #e2d8c9;
      transition: transform 0.2s;
    }

    .card-item:hover {
      transform: scale(1.05) rotate(1deg);
    }

    .card-letter {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 700;
      color: #1b4332;
    }

    .card-img-preview {
      width: 100%;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      display: none;
      margin-bottom: 5px;
    }

    .upload-btn-mini {
      font-size: 10px;
      background: #e2e8f0;
      color: #334155;
      padding: 4px 6px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      margin-top: 4px;
    }

    .back-btn {
      background: #ffffff;
      color: #800020;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-top: 10px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height:
