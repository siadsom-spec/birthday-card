<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Creator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="container">

    <h1>🎂 Birthday Website Creator 🎂</h1>

    <div class="form">

        <input type="text" id="name" placeholder="Birthday Person Name">

        <input type="text" id="from" placeholder="Your Name">

        <textarea id="message"
            placeholder="Write your birthday message..."></textarea>

        <input type="file"
               id="photo"
               accept="image/*">

        <button onclick="createCard()">
            🎉 Create Birthday Page
        </button>

    </div>

</div>

<!-- Birthday Page -->
<div id="birthdayPage" class="hidden">

    <div class="card">

        <img id="profileImage">

        <h1 id="personName"></h1>

        <p id="birthdayMessage"></p>

        <h3 id="senderName"></h3>

        <button onclick="playMusic()">
            ▶ Play Music
        </button>

    </div>

</div>

<audio id="music" loop>
    <source src="happybirthday.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
