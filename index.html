<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowerIsBlooming - Gift Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       GLOBAL STYLES & BACKGROUND
       ========================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0d2818;
      background-image: 
        radial-gradient(circle at 50% 0%, #1a4228 0%, #0d2818 70%),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="20" cy="20" r="15" fill="rgba(255,255,255,0.02)"/><circle cx="80" cy="70" r="25" fill="rgba(255,255,255,0.02)"/></svg>');
      color: #e2ebe4;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .app-viewport {
      width: 100%;
      max-width: 430px;
      padding: 12px 14px;
      position: relative;
    }

    /* TOP NAVIGATION HEADER */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 16px 0;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #e27d60;
      display: inline-block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-selector {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .avatar-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #333;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* MAIN TITLE & HEADER BUTTONS */
    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 400;
      text-align: center;
      margin: 10px 0 16px 0;
      color: #f3f7f4;
      letter-spacing: -0.5px;
    }

    .btn-action-outline {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 12px;
      border-radius: 25px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .link-subtext {
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #d1e0d5;
      margin-bottom: 14px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* YOUTUBE EMBED CONTAINER */
    .video-card-wrapper {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .video-card-wrapper iframe {
      width: 100%;
      height: 200px;
      border: none;
      display: block;
    }

    /* ==========================================================
       FORM SECTIONS & CARDS
       ========================================================== */
    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #b3c9b8;
      text-transform: uppercase;
    }

    .custom-input {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      width: 100%;
    }

    .custom-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    /* TOGGLE SWITCHES (SIMPLE / ADVANCED) */
    .segmented-control {
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 30px;
      display: flex;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 16px;
    }

    .segmented-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 25px;
      background: transparent;
      color: #a2baa7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .segmented-btn.active {
      background: #ffffff;
      color: #0d2818;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* SECTION TITLE WITH NUMBERS */
    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .num-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-title-text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: #2e7d32;
      width: 16px;
      height: 16px;
    }

    .sub-instruction {
      font-size: 11px;
      color: #a3c2ab;
      margin-bottom: 12px;
    }

    /* COLOR PALETTE DOTS */
    .palette-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .palette-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #8dae95;
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.1s;
    }

    .color-dot.active {
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    /* HORIZONTAL SCROLL CARDS (LOCKS, OPENERS, SCRAPBOOKS) */
    .horizontal-scroll-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none; /* Firefox */
    }

    .horizontal-scroll-container::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .preview-card-item {
      min-width: 105px;
      max-width: 105px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }

    .card-thumb {
      width: 105px;
      height: 155px;
      border-radius: 14px;
      background: #1e3d27;
      border: 2px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .preview-card-item.selected .card-thumb {
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(255,255,255,0.3);
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-caption {
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      color: #cde0d2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* BUTTONS INSIDE CARDS */
    .media-buttons-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .media-upload-btn {
      flex: 1;
      background: rgba(255, 255
